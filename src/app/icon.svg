<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Radial Wood Background Gradient -->
    <radialGradient id="woodRadial" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#8B572F" />
      <stop offset="45%" stop-color="#5A2E19" />
      <stop offset="90%" stop-color="#3B1F12" />
      <stop offset="100%" stop-color="#241108" />
    </radialGradient>
    
    <!-- Gold Metallic Gradient -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCEAB8" />
      <stop offset="25%" stop-color="#E8BC64" />
      <stop offset="50%" stop-color="#C2872A" />
      <stop offset="75%" stop-color="#F1D18A" />
      <stop offset="100%" stop-color="#9E6719" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="woodShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1A0D07" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Outer Beveled Wooden Ring (Matches Zaad 3D logo) -->
  <circle cx="60" cy="60" r="54" fill="url(#woodRadial)" stroke="url(#goldGradient)" stroke-width="3.5" filter="url(#woodShadow)" />
  <circle cx="60" cy="60" r="47" fill="none" stroke="#241108" stroke-width="1.5" opacity="0.8" />
  <circle cx="60" cy="60" r="45" fill="none" stroke="url(#goldGradient)" stroke-width="1" opacity="0.6" />

  <!-- Top Triple Leaves Motif (from Zaad logo) -->
  <!-- Center Leaf -->
  <path d="M60 22 C60 22, 69 31, 67 43 C65 47, 60 48, 60 48 C60 48, 55 47, 53 43 C51 31, 60 22, 60 22 Z" 
        fill="url(#woodRadial)" stroke="url(#goldGradient)" stroke-width="1.8" />
  <path d="M60 24 L60 46" stroke="url(#goldGradient)" stroke-width="1.2" stroke-linecap="round" />

  <!-- Left Leaf -->
  <path d="M47 31 C47 31, 57 35, 57 46 C56 50, 52 51, 50 50 C44 47, 41 38, 47 31 Z" 
        fill="url(#woodRadial)" stroke="url(#goldGradient)" stroke-width="1.5" />
  <path d="M48 33 Q52 41 53 48" stroke="url(#goldGradient)" stroke-width="1" stroke-linecap="round" />

  <!-- Right Leaf -->
  <path d="M73 31 C73 31, 63 35, 63 46 C64 50, 68 51, 70 50 C76 47, 79 38, 73 31 Z" 
        fill="url(#woodRadial)" stroke="url(#goldGradient)" stroke-width="1.5" />
  <path d="M72 33 Q68 41 67 48" stroke="url(#goldGradient)" stroke-width="1" stroke-linecap="round" />

  <!-- Center Signature "Z" Calligraphic Glyphs in Gold & Wood -->
  <g transform="translate(60, 72) scale(1.15)">
    <!-- Zaad Initial Monogram "Z" with ornate script flourishes -->
    <path d="M -22 -14 C -15 -18, 12 -18, 18 -13 C 21 -10, 19 -5, 14 -3 C 5 1, -8 11, -12 18 C 0 17, 14 16, 20 20 C 18 23, 2 24, -18 24 C -22 24, -23 20, -18 14 C -12 7, 5 -4, 9 -9 C 9 -12, -10 -11, -18 -8 Z" 
          fill="url(#goldGradient)" filter="url(#woodShadow)" />
    <!-- Secondary Leaf flourish at tail -->
    <path d="M 17 19 C 24 16, 26 23, 22 26 C 18 28, 16 22, 17 19 Z" 
          fill="url(#goldGradient)" />
  </g>
</svg>
